name: Extract static website ZIP

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  extract-website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract website into repository root
        run: |
          if [ ! -f college-website-github-upload.zip ]; then
            echo "Website ZIP already extracted; nothing to do."
            exit 0
          fi
          unzip -o college-website-github-upload.zip -d .
          rm college-website-github-upload.zip
      - name: Commit extracted website files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Extract static college website files"
            git push
          fi
